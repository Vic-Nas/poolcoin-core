{% extends "base.html" %}
{% block content %}
<h2>Economics</h2>
<div id="stats-loading" style="color:var(--muted);font-size:.85rem;padding:1rem 0">Loading chain data...</div>
<div id="stats-content" style="display:none">
  <div class="stats" style="margin-bottom:1rem" id="stat-cards"></div>
  <div class="chart-wrap">
    <div class="chart-title">Mint vs burn (cumulative)</div>
    <svg id="chart-mintburn" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="legend">
      <span><span class="legend-dot" style="background:var(--accent)"></span>Minted</span>
      <span><span class="legend-dot" style="background:var(--red)"></span>Burned fees</span>
    </div>
  </div>
</div>
<script>
let RINGS_PER_ECH = 100_000_000;
let SUPPLY_CAP_RINGS = 21_000_000 * RINGS_PER_ECH;
const fmt = rings => (rings / RINGS_PER_ECH).toFixed(4) + ' ECH';
const fmtPct = (a, b) => b ? (a / b * 100).toFixed(2) + '%' : '0%';

function polyline(points, xKey, yKey, W, H, PAD, maxX, maxY) {
  if (!points.length) return '';
  const px = p => PAD + (p[xKey] / maxX) * (W - PAD * 2);
  const py = p => H - PAD - (p[yKey] / maxY) * (H - PAD * 2);
  return points.map((p, i) =>
    (i === 0 ? 'M' : 'L') + px(p).toFixed(1) + ',' + py(p).toFixed(1)
  ).join(' ');
}

function axisLabels(svg, W, H, PAD, maxX, maxY) {
  for (let i = 0; i <= 4; i++) {
    const x = PAD + (i / 4) * (W - PAD * 2);
    const val = Math.round((i / 4) * maxX);
    svg.innerHTML += `<text x="${x}" y="${H - 4}" fill="#5a6070" font-size="10" text-anchor="middle">${val}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const y = H - PAD - (i / 4) * (H - PAD * 2);
    const val = (i / 4) * maxY / RINGS_PER_ECH;
    const label = val >= 1 ? val.toFixed(1) + ' ECH' : (val * 1000).toFixed(1) + ' mECH';
    svg.innerHTML += `<text x="${PAD - 4}" y="${y + 4}" fill="#5a6070" font-size="10" text-anchor="end">${label}</text>`;
  }
  for (let i = 1; i <= 3; i++) {
    const y = H - PAD - (i / 4) * (H - PAD * 2);
    svg.innerHTML += `<line x1="${PAD}" y1="${y}" x2="${W - PAD}" y2="${y}" stroke="#1e2330" stroke-width="1"/>`;
  }
}

function drawChart(svgId, points, lines, maxX, maxY) {
  const svg = document.getElementById(svgId);
  const W = 800, H = 220, PAD = 48;
  svg.innerHTML = '';
  if (!points.length) {
    svg.innerHTML = '<text x="400" y="110" fill="#5a6070" font-size="13" text-anchor="middle">No data yet — mine some blocks first.</text>';
    return;
  }
  axisLabels(svg, W, H, PAD, maxX, maxY);
  for (const {key, color, width} of lines) {
    const d = polyline(points, 'height', key, W, H, PAD, maxX, maxY);
    if (d) svg.innerHTML += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width || 1.5}"/>`;
  }
}

fetch('/api/stats')
  .then(r => r.json())
  .then(data => {
    document.getElementById('stats-loading').style.display = 'none';
    document.getElementById('stats-content').style.display = '';
    const t = data.totals;
    RINGS_PER_ECH = t.rings_per_ech || RINGS_PER_ECH;
    SUPPLY_CAP_RINGS = t.supply_cap || SUPPLY_CAP_RINGS;

    const circPct = fmtPct(t.circulating, SUPPLY_CAP_RINGS);
    const netLast = t.net_emission_last || 0;
    const netColor = netLast >= 0 ? 'var(--green)' : 'var(--red)';
    const netSign = netLast >= 0 ? '+' : '';
    const netLabel = `<span style="color:${netColor}">${netSign}${fmt(netLast)}/block</span>`;

    const cards = [
      ['Circulating', `${fmt(t.circulating)}<br><span style="color:var(--muted);font-size:.8rem">${circPct} of 21M cap</span>`],
      ['Net emission (last block)', netLabel],
    ];
    document.getElementById('stat-cards').innerHTML = cards.map(([label, val]) =>
      `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value" style="font-size:1rem">${val}</div></div>`
    ).join('');

    const pts = data.points;
    if (!pts.length) return;
    const maxX = pts[pts.length - 1].height;
    const maxYBurn = Math.max(...pts.map(p => p.minted)) * 1.05 || 1;
    drawChart('chart-mintburn', pts, [
      {key: 'minted',      color: 'var(--accent)', width: 2},
      {key: 'burned_fees', color: 'var(--red)',    width: 2},
    ], maxX, maxYBurn);
  })
  .catch(() => {
    document.getElementById('stats-loading').textContent = 'Failed to load stats.';
  });
</script>
{% endblock %}
